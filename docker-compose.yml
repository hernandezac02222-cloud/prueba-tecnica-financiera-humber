version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres-financiera
    restart: always
    environment:
      POSTGRES_DB: prueba_tecnica_financiera
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: app-financiera
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: prueba_tecnica_financiera
      DB_USER: postgres
      DB_PASSWORD: postgres

volumes:
  postgres_data: